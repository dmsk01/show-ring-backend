# Dev-override для Show Ring (этап 15).
#
# Подключается поверх базового docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Что меняет:
# - Поднимает MailPit (SMTP-заглушка), UI на http://localhost:8025.
# - В api подключает bind-mount исходников и запускает с --reload —
#   изменения в коде применяются без пересборки образа.
# - DEBUG=true → включает echo SQL в SQLAlchemy.
# - LOG_JSON=false (плейн-логи в консоль удобнее на dev).
#
# В prod compose-файл с overrides НЕ применяется; используется только
# docker-compose.yml.

services:
  # Dev-порты инфры: базовый docker-compose.yml host-порты НЕ публикует
  # (прод-безопасный дефолт), наружу их выставляет только dev-override.
  postgres:
    ports:
      - "5432:5432"   # psql / DBeaver

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI — http://localhost:15672 (guest/guest)

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console

  # migrate тоже на bind-mount (как api/воркеры): без него одноразовый
  # контейнер берёт миграции из СТАРОГО образа и не видит ревизий,
  # накатанных через api/CLI с live-кодом — DB уходит вперёд, и
  # `alembic upgrade head` падает с "Can't locate revision". Монтируем
  # тот же набор, что api.
  migrate:
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped  # поднимается сама после рестарта Docker (см. docker-compose.yml postgres)
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    healthcheck:
      # mailpit отдаёт UI по / без auth — wget на главную достаточен.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    # Прямой доступ к API без прокси — только dev (в prod вход через nginx).
    ports:
      - "8000:8000"
    # Bind-mount всего репозитория: код сразу виден в контейнере.
    # uvicorn --reload отслеживает изменения .py и перезагружается.
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro
      - ./worker:/app/worker
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DEBUG: "true"
      # Включаем шедулер на dev, чтобы можно было тестировать cron-задачи
      # (они быстрые и не вредят).
      SCHEDULER_ENABLED: "true"
    depends_on:
      mailpit:
        condition: service_healthy

  # Воркеры на dev тоже подхватывают код через bind-mount. uvicorn
  # --reload им не нужен, но при изменении кода нужно вручную
  # перезапустить контейнер: `docker compose restart <worker>`.
  #
  # ВАЖНО (анти-«лавина образов»): bind-mount нужен КАЖДОМУ воркеру,
  # иначе правка кода требует `docker compose build <worker>` → новый
  # образ забирает тег :latest, прежний осиротевает в <none> (~350 MB).
  # 7 сервисов из одного Dockerfile = до 7 dangling-образов за ребилд.
  # С монтированием код меняется рестартом, образы не плодятся.
  # Профильные (events) воркеры монтируем тоже — иначе они отстают от
  # api по коду (как было с этапом 16).
  worker:
    volumes:
      - ./app:/app/app
      - ./worker:/app/worker

  worker-files:
    volumes:
      - ./app:/app/app
      - ./worker:/app/worker

  worker-events:
    volumes:
      - ./app:/app/app
      - ./worker:/app/worker

  worker-email:
    volumes:
      - ./app:/app/app
      - ./worker:/app/worker

  worker-outbox:
    volumes:
      - ./app:/app/app
      - ./worker:/app/worker
