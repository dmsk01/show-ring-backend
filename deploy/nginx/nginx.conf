# Главный конфиг nginx для Show Ring (прод, один VPS).
# Зоны limit_req и map для WebSocket обязаны жить в http-контексте —
# поэтому свой nginx.conf, а не только conf.d.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # --- Медленные атаки (slowloris и др.), план защиты 2026-10-05 ---
    # По умолчанию nginx ждёт заголовки и тело по 60 с: тысяча «висящих»
    # соединений с медленной отправкой занимает воркеры. Таймауты — между
    # двумя операциями чтения/записи, а не на весь запрос, поэтому загрузка
    # 10 МБ с медленного мобильного не обрывается.
    client_header_timeout 10s;
    client_body_timeout   15s;
    send_timeout          15s;
    keepalive_timeout     20s;
    # Не светить версию nginx в заголовке Server и на страницах ошибок.
    server_tokens off;

    # Встроенный DNS Docker — для ленивого резолва api/web через переменные
    # в proxy_pass (conf.d/show-ring.conf). Без resolver'а переменный
    # proxy_pass не запускается. valid=10s — перечитывать запись при
    # пересоздании контейнеров; ipv6=off — Docker DNS отдаёт A-записи,
    # AAAA-запросы только зря шумят в error_log.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Edge rate limit (первая линия; вторая — progressive_ban.py) ---
    # Ключ — IP клиента. Зона 10m вмещает ~160k IP, хватит с запасом.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    # По умолчанию nginx отдаёт 503 на превышение — выставляем честный 429.
    limit_req_status 429;

    # --- Одновременные соединения с одного IP ---
    # limit_req ограничивает ЧАСТОТУ, но не число открытых соединений:
    # без limit_conn с одного адреса можно держать тысячи сокетов
    # (WebSocket живёт до часа). Лимиты — в conf.d/show-ring.conf.
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    # --- WebSocket upgrade (есть /ws/notifications и /support/ws/{id}) ---
    # Если клиент прислал Upgrade — пробрасываем его до upstream'а,
    # иначе закрываем Connection (обычный HTTP keep-alive).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Зеркалит max_upload_size_bytes приложения (10 МБ) — defence-in-depth.
    client_max_body_size 10m;

    include /etc/nginx/conf.d/*.conf;
}
