# Реальный IP клиента за сервисом защиты от DDoS (план защиты 2026-10-05).
#
# Пока DNS указывает прямо на сервер, файл пустой (только комментарии) —
# nginx видит настоящий адрес клиента сам.
#
# Когда трафик пойдёт через DDoS-Guard / Qrator / StormWall / другой прокси,
# все запросы будут приходить с ИХ адресов. Без этой настройки все лимиты
# (limit_req, limit_conn, лимиты приложения) станут общими на весь сайт:
# пятый вход за минуту у любого посетителя заблокирует вход всем.
#
# Включение:
#  1. Взять у провайдера список его диапазонов IP (обычно есть страница или
#     файл в личном кабинете) и вписать каждый строкой set_real_ip_from.
#  2. real_ip_header — заголовок с адресом клиента, который ставит провайдер
#     (чаще всего X-Forwarded-For или X-Real-IP; смотреть в его документации).
#  3. docker compose ... exec nginx nginx -t && nginx -s reload
#  4. Закрыть прямой доступ к серверу в обход защиты — см.
#     docs/deployment-linux.md, раздел «Защита от DDoS».
#
# set_real_ip_from 203.0.113.0/24;   # пример — диапазоны провайдера
# set_real_ip_from 198.51.100.0/24;
# real_ip_header   X-Forwarded-For;
# real_ip_recursive on;
