# Общие proxy-заголовки для всех location'ов.
# X-Forwarded-For/Proto читает app/middleware/proxy_headers.py —
# он доверяет им, только если peer входит в FORWARDED_ALLOW_IPS
# (в prod-compose это подсеть docker-сети 172.28.0.0/16).
#
# X-Forwarded-For ПЕРЕЗАПИСЫВАЕМ адресом peer'а, а не дописываем
# ($proxy_add_x_forwarded_for): nginx — первый узел перед клиентом, и
# всё, что клиент прислал в этом заголовке сам, — подделка. С дописыванием
# "X-Forwarded-For: 1.2.3.4" от атакующего доезжал до бэка первым элементом
# и обходил все rate-limit'ы по IP (ревью безопасности 2026-10-03, #1).
# Если перед nginx появится Cloudflare/туннель — включить модуль real_ip
# (set_real_ip_from <CIDR прокси>; real_ip_header CF-Connecting-IP;),
# тогда $remote_addr станет реальным IP клиента и эта строка не меняется.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# HTTP/1.1 + Upgrade — нужно для WebSocket (map в nginx.conf).
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# WS-соединения уведомлений живут долго и молчат; дефолтные 60s
# рвали бы их. 3600s — компромисс (приложение само закрывает мёртвые).
proxy_read_timeout 3600s;
