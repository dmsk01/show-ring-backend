# Защитные заголовки для страниц фронта (Next.js, location /).
#
# Ответам API их ставит сам бэк (app/middleware/security_headers.py), поэтому
# в /api/-location'ы этот snippet НЕ подключаем — иначе заголовки задвоятся.
#
# ВАЖНО: add_header внутри location отменяет все add_header уровнем выше.
# Поэтому заголовки собраны в snippet и подключаются прямо в location /.
#
# Полный CSP с nonce (script-src только для скриптов этого ответа) ставит
# сам фронт — src/proxy.ts в show-ring-frontend (план защиты 2026-10-05,
# этап 4): nonce генерируется на каждый запрос, nginx этого не умеет.
# Минимальный CSP ниже остаётся страховкой (например, при CSP_MODE=off):
# браузер применяет ОБА заголовка, итог — их пересечение.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
