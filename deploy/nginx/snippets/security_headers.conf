# Защитные заголовки для страниц фронта (Next.js, location /).
#
# Ответам API их ставит сам бэк (app/middleware/security_headers.py), поэтому
# в /api/-location'ы этот snippet НЕ подключаем — иначе заголовки задвоятся.
#
# ВАЖНО: add_header внутри location отменяет все add_header уровнем выше.
# Поэтому заголовки собраны в snippet и подключаются прямо в location /.
#
# CSP здесь намеренно минимальный: запрет встраивания во фреймы
# (clickjacking), <base>-инъекций и плагинов. Ограничение script-src для
# Next.js требует nonce'ов — отдельная задача; начинать её стоит с
# Content-Security-Policy-Report-Only.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
