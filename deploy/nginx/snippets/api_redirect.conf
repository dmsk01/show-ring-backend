# Возврат префикса /api в Location-заголовках бэка.
#
# FastAPI (redirect_slashes) отвечает 307 на путь без trailing slash:
# GET /api/health -> бэк видит /health -> Location: http://<host>/health/
# — БЕЗ /api, бэк о префиксе не знает. Браузер ушёл бы на фронт и
# получил 404. Переписываем Location обратно под /api.
#
# Матчим только СВОЙ хост ($host): чужие адреса (например, будущие
# presigned-URL'ы MinIO) не трогаем. Сам бэк собственных редиректов
# не делает (проверено 2026-06-12) — под правило попадает только
# slash-redirect Starlette.
#
# Подключать ТОЛЬКО в /api/-location'ах: у фронта свои редиректы
# (Next), их переписывать нельзя.
proxy_redirect http://$host/ /api/;
proxy_redirect https://$host/ /api/;
