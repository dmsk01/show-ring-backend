# Виртуальный хост ShowTail. Сейчас работает только :80 (домена нет).
# При появлении домена: следовать инструкции у блока 443 внизу файла.
#
# Разводка трафика (интеграция фронта, 2026-06-12): SPA на «/», API под
# «/api/». Trailing slash в proxy_pass СРЕЗАЕТ префикс /api — бэк
# по-прежнему слушает на корне (/auth, /users, …), роуты не меняются.
# Куки бэка ставятся на публичные пути (COOKIE_PATH_PREFIX=/api).

upstream showtail_api {
    server api:8000;
}

upstream showtail_web {
    server web:8082;
}

server {
    listen 80;
    server_name _;

    # ACME-челлендж certbot'а (активен, когда появится домен).
    # Должен идти ДО общих location'ов и БЕЗ rate-limit.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Auth — жёсткая зона: credential stuffing и SMS pumping режем
    # на edge, до Python. nodelay — не выстраивать очередь, отбивать сразу.
    # /api/auth/login → /auth/login (URI-часть в proxy_pass заменяет
    # совпавший префикс location).
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/api_redirect.conf;
        proxy_pass http://showtail_api/auth/;
    }

    # Остальной API — общая зона. WS-заголовки (Upgrade/Connection,
    # proxy_read_timeout 3600s) приходят из snippets/proxy.conf —
    # /api/ws/notifications и /api/support/ws/{id} работают через них.
    location /api/ {
        limit_req zone=general burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/api_redirect.conf;
        proxy_pass http://showtail_api/;
    }

    # Фронт (Next.js SSR + статика). Та же general-зона: SSR-страницы
    # не бесплатные, edge-лимит оставляем.
    location / {
        limit_req zone=general burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://showtail_web;
    }
}

