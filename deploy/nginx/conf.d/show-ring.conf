# Виртуальный хост Show Ring. Сейчас работает только :80 (домена нет).
# При появлении домена: следовать инструкции у блока 443 внизу файла.
#
# Разводка трафика (интеграция фронта, 2026-06-12): SPA на «/», API под
# «/api/». Trailing slash в proxy_pass СРЕЗАЕТ префикс /api — бэк
# по-прежнему слушает на корне (/auth, /users, …), роуты не меняются.
# Куки бэка ставятся на публичные пути (COOKIE_PATH_PREFIX=/api).

# Upstream'ы НЕ объявляем статически (`upstream { server api:8000; }`):
# nginx резолвит имена в upstream/proxy_pass ОДИН раз при старте, и если
# контейнер api/web ещё не попал в DNS (гонка старта, ребут сервера) —
# nginx падает с `[emerg] host not found in upstream` и уходит в
# Restarting (инцидент 2026-06-17). Вместо этого — ленивый резолв на
# каждый запрос: имя сервиса в переменной + resolver Docker (127.0.0.11,
# задан в nginx.conf). nginx стартует, даже если api/web временно недоступны.

server {
    listen 80;
    server_name _;

    # Имена сервисов в переменных — заставляют proxy_pass резолвить их
    # через resolver в рантайме, а не на старте (см. комментарий выше).
    set $api "api:8000";
    set $web "web:8082";

    # Не больше 50 одновременных соединений с одного IP (план защиты
    # 2026-10-05). С запасом для офиса/кафе за одним NAT и нескольких
    # вкладок; HTTP/2 к тому же мультиплексирует запросы в одно соединение.
    limit_conn perip 50;

    # ACME-челлендж certbot'а (активен, когда появится домен).
    # Должен идти ДО общих location'ов и БЕЗ rate-limit.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Auth — жёсткая зона: credential stuffing и SMS pumping режем
    # на edge, до Python. nodelay — не выстраивать очередь, отбивать сразу.
    # /api/auth/login → /auth/login (URI-часть в proxy_pass заменяет
    # совпавший префикс location).
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/api_redirect.conf;
        # proxy_pass через переменную не умеет URI-замену префикса локейшна,
        # поэтому /api срезаем сами: /api/auth/login -> бэк видит /auth/login.
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$api;
    }

    # WebSocket: уведомления (/api/ws/notifications) и чат поддержки
    # (/api/support/ws/{id}). Соединение живёт долго и молчит — таймаут
    # чтения час (приложение само закрывает мёртвые). Не больше 10 сокетов
    # с IP: вкладки × два канала, но не тысячи.
    location ~ ^/api/(ws|support/ws)/ {
        limit_req zone=general burst=40 nodelay;
        limit_conn perip 10;
        include /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 3600s;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$api;
    }

    # Остальной API — общая зона.
    location /api/ {
        limit_req zone=general burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/api_redirect.conf;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$api;
    }

    # Статика Next.js (JS/CSS с хэшем в имени) — без limit_req: первая
    # загрузка страницы тянет десятки файлов, и при всплеске general-зона
    # отдавала бы 429 обычному посетителю. Файлы дешёвые, limit_conn
    # на уровне server по-прежнему действует.
    location /_next/static/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_cache next_static;
        proxy_cache_valid 200 30d;
        # Один запрос в Node на файл, даже если кэш пуст и пришла толпа.
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://$web;
    }

    # Фронт (Next.js SSR). Та же general-зона: SSR-страницы
    # не бесплатные, edge-лимит оставляем. URI не трогаем — переменный
    # proxy_pass без URI-части отдаёт бэку исходный путь как есть.
    location / {
        limit_req zone=general burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security_headers.conf;
        proxy_pass http://$web;
    }
}

# --- HTTPS: раскомментировать при появлении домена ---------------------
# Порядок включения TLS:
#  1. DNS A-запись домена -> IP VPS.
#  2. В .env задать DOMAIN=<домен>; в этом файле заменить
#     show-ring.example на домен (3 места).
#  3. Однократно выпустить сертификат:
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#       run --rm certbot certonly --webroot -w /var/www/certbot \
#       -d show-ring.example --email admin@show-ring.example --agree-tos
#  4. Раскомментировать server-блок ниже; в :80-блоке заменить
#     location / на redirect:  return 301 https://$host$request_uri;
#     В :80-блоке заменить `server_name _;` на домен и раскомментировать
#     сервер-заглушку ниже: запросы по IP и на чужие имена (сканеры
#     уязвимостей) получат 444 и до приложения не дойдут.
