# CI/CD pipeline для ShowTail (GitLab CI).
#
# Эквивалент .github/workflows/ci.yml — на случай переезда/зеркала на GitLab.
# Стадии: lint → test → build → deploy.
#
# Тонкость (как и в GitHub-пайплайне): интеграционные тесты требуют живые
# Postgres + Redis и накатанные миграции. conftest.py только открывает
# транзакцию, таблицы НЕ создаёт — поэтому перед pytest идёт
# `alembic upgrade head`. Без живой инфры тесты делают skip (обманчиво
# «зелёный» прогон), поэтому services обязательны.

stages: [lint, test, build, deploy]

default:
  image: python:3.12-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "pip-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

lint:
  stage: lint
  script:
    # ruff/pyright не в requirements.txt — dev-tools ставим отдельно.
    - pip install ruff pyright
    - ruff check .
    - pyright app worker

test:
  stage: test
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: redis:8-alpine
      alias: redis
  variables:
    POSTGRES_DB: showtail_test
    POSTGRES_USER: showtail
    POSTGRES_PASSWORD: showtail
    # В GitLab services резолвятся по alias-имени (postgres/redis), не localhost.
    DATABASE_URL: "postgresql+asyncpg://showtail:showtail@postgres:5432/showtail_test"
    REDIS_URL: "redis://redis:6379/0"
    # ≥32 символов и не плейсхолдер (app/config.py). CI-значение, не для прода.
    SECRET_KEY: "ci-secret-key-not-for-production-0123456789abcdef"
  script:
    - pip install -r requirements.txt
    - alembic upgrade head      # таблицы должны существовать ДО тестов
    - pytest -q

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    # $CI_REGISTRY* подставляет сам GitLab — пуш во встроенный Container Registry.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client docker-cli
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # Деплой через прод-связку compose: docker-compose.prod.yml даёт
    # api/worker'ам образ из registry, nginx и backup. Compose-файлы
    # приезжают на сервер git pull'ом (репозиторий клонирован в
    # /opt/showtail). ВНИМАНИЕ: образ в docker-compose.prod.yml захардкожен
    # на ghcr.io — при переезде на GitLab Container Registry заменить
    # на $CI_REGISTRY_IMAGE.
    # Нужные CI/CD variables (protected): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/showtail
        && git pull --ff-only
        && docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
        && docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm migrate
        && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build backup
        && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
        && docker image prune -f"
  environment:
    name: production
  rules:
    # Ручной деплой с main — кнопка в UI, чтобы не катить прод автоматом.
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
