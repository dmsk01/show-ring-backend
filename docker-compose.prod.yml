# Прод-оверлей Show Ring. Применяется ПОВЕРХ базового файла:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Образы собираются ЛОКАЛЬНО на сервере (`up --build`) — ни бэк, ни фронт
# НЕ тянутся из внешнего registry. Нулевая зависимость от ghcr/GitHub:
# переезд на другой хостинг кода = git clone + up --build, без изменений.
#
# Что добавляет/меняет относительно базы:
# - api: несколько uvicorn-воркеров вместо одного процесса + лимит памяти.
# - worker*: лимиты памяти (Pillow в worker-files — самый прожорливый).
# - web: фронт (Next.js, репо show-ring-frontend) собирается из соседнего
#   каталога ../show-ring-frontend. Слушает 8082, наружу не публикуется —
#   единственный вход в стек остаётся nginx, который разводит / → web и
#   /api/ → api. На сервере репо фронта должен лежать рядом с этим репо.
# - nginx — ЕДИНСТВЕННЫЕ наружные порты (80/443). Порты инфры база
#   не публикует вовсе (см. инверсию в docker-compose.dev.yml).
# - certbot — под profile "tls", включается при появлении домена
#   (порядок включения: deploy/nginx/conf.d/show-ring.conf, низ файла).
# - backup — crond: pg_dump + mc mirror + ротация (deploy/backup/).
# - Фиксированная подсеть 172.28.0.0/16: FORWARDED_ALLOW_IPS должен
#   ссылаться на стабильный CIDR, иначе proxy_headers.py не доверится
#   nginx'у после пересоздания сети.

services:
  api:
    # Прод: несколько uvicorn-воркеров вместо одного процесса.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0",
              "--port", "8000", "--workers", "${UVICORN_WORKERS:-2}"]
    environment:
      # JSON-список для pydantic-settings (list[str]).
      FORWARDED_ALLOW_IPS: '["172.28.0.0/16"]'
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    deploy:
      resources:
        limits:
          memory: 512M

  worker-files:
    deploy:
      resources:
        limits:
          # Pillow (превью/watermark) — самый прожорливый воркер.
          memory: 512M

  worker-events:
    deploy:
      resources:
        limits:
          memory: 256M

  worker-email:
    deploy:
      resources:
        limits:
          memory: 256M

  worker-outbox:
    deploy:
      resources:
        limits:
          memory: 256M

  # Веб-фронт (Next.js, репо show-ring-frontend). Собирается локально из
  # соседнего каталога. Наружу не публикуется — вход в стек только через
  # nginx (/ → web, /api/ → api).
  web:
    build: ../show-ring-frontend
    environment:
      # Фолбэк для SSR-запросов изнутри контейнера (минуя nginx);
      # браузерные запросы ходят относительным /api через nginx.
      BACKEND_URL: http://api:8000
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      # Сертификаты и ACME-webroot шарятся с certbot.
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_started
      # У образа фронта есть HEALTHCHECK на /healthz — ждём готовности,
      # иначе nginx стартует раньше web и первые запросы ловят 502.
      web:
        condition: service_healthy
    # Фоновый reload каждые 6h — подхватывать продлённые certbot'ом
    # сертификаты без ручного вмешательства. $$ — экранирование для compose.
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"
    restart: unless-stopped

  # Авто-продление сертификата. Выключен, пока нет домена:
  # включается `--profile tls` ПОСЛЕ первичного выпуска сертификата
  # (см. инструкцию в deploy/nginx/conf.d/show-ring.conf).
  certbot:
    image: certbot/certbot
    profiles: ["tls"]
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  backup:
    build: ./deploy/backup
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-show_ring}
      POSTGRES_USER: ${POSTGRES_USER:-show_ring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-show_ring}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-show_ring}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-show_ring_minio}
      S3_BUCKET: ${S3_BUCKET:-show-ring-files}
      BACKUP_CRON: ${BACKUP_CRON:-30 3 * * *}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      # Offsite: задать все четыре -> бэкапы зеркалятся во внешний S3.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
    volumes:
      # bind-mount: бэкапы видны с хоста как ./backups без docker-команд.
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

# Фиксированная подсеть default-сети — стабильный CIDR для
# FORWARDED_ALLOW_IPS (см. комментарий в шапке).
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  certbot_etc:
  certbot_www:
