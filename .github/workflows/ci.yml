# CI/CD pipeline для ShowTail (GitHub Actions).
#
# Стадии: lint → test → build → deploy.
# - lint/test гоняются на каждый push и pull request.
# - build/deploy — только на main (push), чтобы не пушить образы с PR.
#
# Тонкость: интеграционные тесты требуют ЖИВЫЕ Postgres + Redis (иначе
# conftest.py делает skip) и накатанные миграции (conftest только
# открывает транзакцию, таблицы не создаёт). Поэтому в job test есть
# services + шаг `alembic upgrade head` ПЕРЕД pytest.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # ruff/pyright не в requirements.txt — ставим отдельно как dev-tools.
      - run: pip install ruff pyright
      - run: ruff check .
      - run: pyright app worker

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: showtail_test
          POSTGRES_USER: showtail
          POSTGRES_PASSWORD: showtail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U showtail"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # asyncpg-URL на localhost:5432 (порт services проброшен на хост раннера).
      DATABASE_URL: postgresql+asyncpg://showtail:showtail@localhost:5432/showtail_test
      REDIS_URL: redis://localhost:6379/0
      # SECRET_KEY обязан быть ≥32 символов и не из плейсхолдеров
      # (app/config.py: _validate_secret_key падает при debug=false).
      # Это CI-значение, НЕ использовать в проде.
      SECRET_KEY: ci-secret-key-not-for-production-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      # Таблицы должны существовать ДО тестов — conftest их не создаёт.
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q

  build:
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # пуш в GitHub Container Registry (ghcr.io)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache — ускоряет повторные сборки слоёв.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # environment: production → можно навесить required reviewers /
    # protection rules в настройках репозитория (ручной аппрув деплоя).
    environment: production
    steps:
      # Деплой через прод-связку compose (docker-compose.prod.yml даёт
      # api/worker'ам image: ghcr.io/..., nginx, backup). Compose-файлы
      # и deploy/ приезжают на сервер через git pull — репозиторий
      # должен быть клонирован в /opt/showtail. --build backup
      # пересобирает локальный backup-образ при изменении скриптов.
      #
      # Нужные secrets репозитория:
      #   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY  — доступ по SSH
      #   REGISTRY_USER, REGISTRY_TOKEN             — read:packages для ghcr
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/showtail
            git pull --ff-only
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u "${{ secrets.REGISTRY_USER }}" --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm migrate
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build backup
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker image prune -f
