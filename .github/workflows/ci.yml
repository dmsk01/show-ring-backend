# CI/CD pipeline для Show Ring (GitHub Actions).
#
# Стадии: lint → test → deploy.
# - lint/test гоняются на каждый push и pull request (облачные раннеры).
# - deploy — только push в main, на self-hosted runner'е (на самом
#   прод-сервере): тянет оба репо и пересобирает стек локально через
#   deploy/deploy.sh. Реестр (ghcr) НЕ используется — образы собираются
#   на сервере, как и задумано в docker-compose.prod.yml.
#
# Тонкость: интеграционные тесты требуют ЖИВЫЕ Postgres + Redis (иначе
# conftest.py делает skip) и накатанные миграции (conftest только
# открывает транзакцию, таблицы не создаёт). Поэтому в job test есть
# services + шаг `alembic upgrade head` ПЕРЕД pytest.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # ruff/pyright не в requirements.txt — ставим отдельно как dev-tools.
      - run: pip install ruff pyright
      - run: ruff check .
      - run: pyright app worker

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: show_ring_test
          POSTGRES_USER: show_ring
          POSTGRES_PASSWORD: show_ring
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U show_ring"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # asyncpg-URL на localhost:5432 (порт services проброшен на хост раннера).
      DATABASE_URL: postgresql+asyncpg://show_ring:show_ring@localhost:5432/show_ring_test
      REDIS_URL: redis://localhost:6379/0
      # SECRET_KEY обязан быть ≥32 символов и не из плейсхолдеров
      # (app/config.py: _validate_secret_key падает при debug=false).
      # Это CI-значение, НЕ использовать в проде.
      SECRET_KEY: ci-secret-key-not-for-production-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      # Таблицы должны существовать ДО тестов — conftest их не создаёт.
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q

  deploy:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    # self-hosted runner стоит на ПРОД-СЕРВЕРЕ (метка show-ring). Он держит
    # ИСХОДЯЩЕЕ соединение к GitHub, поэтому работает за NAT — входящий SSH
    # и секреты деплоя в репозитории не нужны. Деплой идёт против рабочих
    # копий в /opt (там лежит .env с секретами), а не против checkout'а
    # раннера — поэтому actions/checkout здесь намеренно НЕ нужен.
    # ВНИМАНИЕ: путь ниже — под реальную раскладку сервера (/opt/show-ring-
    # backend). Сам deploy.sh самолокализуется и пути не хардкодит; здесь
    # хардкод только до точки входа. Поменяешь каталог — поправь и тут.
    runs-on: [self-hosted, show-ring]
    steps:
      - name: Pull repos & rebuild stack
        run: bash /opt/show-ring-backend/deploy/deploy.sh
