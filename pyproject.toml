[tool.pytest.ini_options]
# ИСПРАВЛЕНО: единая точка конфигурации pytest. asyncio_mode=auto, чтобы
# не писать @pytest.mark.asyncio на каждый async тест.
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Явный набор правил вместо дефолта ruff: дефолт меняется между версиями.
# Это классический базовый набор (pyflakes + ошибки E4/E7/E9).
select = ["E4", "E7", "E9", "F"]
